# SonarQube scan configuration — consumed by the `sonar` job in
# .github/workflows/ci.yml (nightly schedule only). Requires the repo to
# define SONAR_TOKEN (secret) and SONAR_HOST_URL (variable).
sonar.projectKey=notees
sonar.sources=packages,apps
sonar.exclusions=**/fixtures/**,**/node_modules/**,**/dist/**
