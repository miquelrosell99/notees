# Notees static web: extend the stock gzip config (which compresses
# text/html only) to the asset types the app actually ships. Loaded from
# conf.d inside the http block, alongside the default server.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
