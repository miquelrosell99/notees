<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/notees-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/app-icon-512.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161412" />
    <title>Notees</title>
    <script>
      // Theme bootstrap — the pre-paint writer of the appearance data-*
      // attributes. MUST mirror src/ui/appearance.ts's
      // resolveAppearanceAttributes verbatim: test/appearance-bootstrap-parity.test.ts
      // executes both implementations against a scenario matrix and fails
      // the gate on any drift. Runs before first paint (and before
      // /config.js) so a stored preference or the system scheme wins
      // without a theme flash. Device-local appearance settings live under
      // "notees.settings.*"; "notees.theme" is the legacy key, still read
      // as a fallback.
      (() => {
        const read = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const parseStored = (raw) => {
          if (raw === null) return null;
          try {
            return JSON.parse(raw);
          } catch {
            return null;
          }
        };
        const stored = parseStored(read("notees.settings.theme"));
        const themePref =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : (() => {
                const legacy = read("notees.theme");
                return legacy === "light" || legacy === "dark" ? legacy : "system";
              })();
        const systemDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme =
          themePref === "system" ? (systemDark ? "dark" : "light") : themePref;
        document.documentElement.dataset.theme = theme;
        const oledOn = parseStored(read("notees.settings.oledMode")) === true;
        document.documentElement.dataset.oled =
          oledOn && theme === "dark" ? "true" : "false";
        const accentRaw = parseStored(read("notees.settings.accentColor"));
        const ACCENT_VALUES = ["margin", "monochrome", "brown", "teal", "blue"];
        document.documentElement.dataset.accent =
          typeof accentRaw === "string" && ACCENT_VALUES.indexOf(accentRaw) !== -1
            ? accentRaw
            : "margin";
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
