<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/notees-icon.svg" type="image/svg+xml" />
    <title>Notees</title>
    <script>
      // Theme bootstrap: dark is the default; a stored preference wins.
      // Runs before first paint (and before /config.js) to avoid a theme flash.
      (() => {
        const t = localStorage.getItem("notees.theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
