# The app server — replaces the stock nginx default.conf. Client-side routes
# are /<node-uuid> (URL sync), so every non-asset path falls back to
# index.html and lets the SPA boot on reload/deep link.
server {
  listen 80;
  server_name _;

  # Uploads ride this proxy (asset CAS posts) — match the sync server's body
  # ceiling (128 MB) instead of nginx's 1 MB default.
  client_max_body_size 128m;

  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API proxy: the browser only ever talks to THIS origin —
  # /api/* forwards to the sync service over the compose network (by name),
  # so there is no separate sync URL to configure, no CORS, and the optional
  # https edge (443) wraps UI and API in one secure context. Direct sync
  # access on the sync port stays for non-browser clients (CLI, agents).
  location /api/ {
    proxy_pass http://notees-sync:8377;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Content-hashed build artifacts (JS/CSS/wasm under /assets/, plus the
  # sprite and config): immutable forever — a new build changes the URL, so
  # long caches are safe and reloads stay cheap.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /mdi-sprite.svg {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html (and every client route's SPA fallback): NEVER cached — a
  # browser holding a stale copy pins the OLD hashed-asset URLs and the
  # user sees the pre-deploy app after a redeploy (ed
  # 2026-10-20: "I redeployed and still see the old checkbox"). no-cache
  # keeps the ETag 304 path for cheap reloads.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
