# The app server — replaces the stock nginx default.conf. Client-side routes
# are /<node-uuid> (URL sync), so every non-asset path falls back to
# index.html and lets the SPA boot on reload/deep link.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
