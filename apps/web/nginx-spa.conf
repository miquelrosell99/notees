# The app server — replaces the stock nginx default.conf. Client-side routes
# are /<node-uuid> (URL sync), so every non-asset path falls back to
# index.html and lets the SPA boot on reload/deep link.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # This container serves static files only — the API lives on the sync
  # service (:8377). Without this, the SPA fallback would answer /api/*
  # with index.html + HTTP 200, and misconfigured clients (mobile app
  # pointed at the web port) "pass" the health ping on HTML and fail in
  # confusing ways. Fail loud instead.
  location /api/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
