[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "notees"
version = "0.1.0"
description = "Self-hosted note-taking application with bidirectional linking"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "python-multipart==0.0.31",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "PyJWT==2.13.0",
    "passlib==1.7.4",
    "bcrypt>=3.1.0,<4.0",
    "python-dotenv==1.2.2",
    "psutil==7.2.2",
    "asyncpg==0.31.0",
    "Pillow==12.2.0",
    "weasyprint==68.1",
    "Pygments==2.20.0",
    "fastapi-limiter==0.2.0",
    "pyrate-limiter>=3.0.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
    "httpx==0.26.0",
    "testcontainers[postgres]==4.4.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # FastAPI standard pattern: Depends() in argument defaults
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
