[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=30
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:crypt
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks tests as unit (fast, no database)
    stress: marks stress/benchmark tests (deselect with '-m "not stress"')
