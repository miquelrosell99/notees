# Web-only deployment: static frontend container, no backend.
# The client boots in local-only mode unless NOTEES_SERVER_URL points at a
# notees-sync (all-in-one) server.
#
# Usage:
#   docker compose -f compose.web.yaml up -d
#   NOTEES_SERVER_URL=https://notes.example.com docker compose -f compose.web.yaml up -d

services:
  web:
    image: ghcr.io/miquelrosell99/notees-web:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: notees-web
    restart: unless-stopped
    ports:
      - "${NOTEES_WEB_PORT:-8080}:80"
    environment:
      NOTEES_SERVER_URL: ${NOTEES_SERVER_URL:-}
