# Notees — production stack (notees-sync server + notees-web client).
# Images are prebuilt and published to ghcr (see apps/*/Dockerfile);
# tags are pinned per release. Data lives under ./config/notees/ (gitignored).

services:
  notees-sync:
    image: ghcr.io/miquelrosell99/notees-sync:${NOTEES_SYNC_TAG:-latest}
    container_name: notees-sync
    # ${NOTEES_SYNC_PORT} (loopback) serves the tailscale serve proxies + the
    # smoke; ${NOTEES_SYNC_LAN_PORT} re-exposes plain HTTP on the LAN. Both
    # bind specific IPs, so tailscaled can hold the tailnet IP on the same
    # port number for HTTPS (deployment.md).
    ports:
      - "${NOTEES_SYNC_PORT:-8377}:8377"
      - "${NOTEES_SYNC_LAN_PORT:-127.0.0.1:18377}:8377"
    volumes:
      - ./config/notees/sync:/data
    environment:
      - NOTEES_DATA_DIR=/data
      - NOTEES_LOG=false
      # Browser clients call the API cross-origin (the web UI on another
      # port/host). Auth is header-based (no cookies), so a wildcard origin
      # exposes no credential surface on a LAN-trusted deployment; override
      # with a comma-separated origin list for stricter setups.
      - NOTEES_CORS_ORIGIN=${NOTEES_CORS_ORIGIN:-*}
    healthcheck:
      test: wget -qO- http://127.0.0.1:8377/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  notees-web:
    image: ghcr.io/miquelrosell99/notees-web:${NOTEES_WEB_TAG:-latest}
    container_name: notees-web
    # Same dual-publish as notees-sync: loopback for the serve proxies,
    # specific LAN IP for plain HTTP (see ${NOTEES_SYNC_LAN_PORT} above).
    ports:
      - "${NOTEES_WEB_PORT:-8378}:80"
      - "${NOTEES_WEB_LAN_PORT:-127.0.0.1:18378}:80"
    environment:
      # Optional prefill for non-standard sync topologies (the web client
      # guesses protocol//hostname:8377 from its own origin, which is right
      # on every standard path — deployment.md; empty ships no prefill).
      - NOTEES_SERVER_URL=${NOTEES_SERVER_URL:-}
    depends_on:
      notees-sync:
        condition: service_healthy
    restart: unless-stopped
