# Notees — production stack (notees-sync server + notees-web client + the
# tailnet HTTPS edge). App images are prebuilt and published to ghcr (see
# apps/*/Dockerfile); tags are pinned per release. Data lives under
# ./config/notees/ (gitignored). The edge image is a one-command local build:
# docker build -t notees-edge:local -f deploy/Dockerfile.caddy deploy/
# (docs/developers/deployment.md).

services:
  notees-sync:
    image: ghcr.io/miquelrosell99/notees-sync
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: notees-sync
    # Loopback only: the edge reaches this over the compose network by name;
    # loopback serves the verify-min smoke. The high LAN port re-exposes
    # plain HTTP for the LAN (docs/developers/deployment.md).
    ports:
      - "${NOTEES_SYNC_HTTP:-0.0.0.0:8377}:8377"
    volumes:
      - ./config/notees/sync:/data
    environment:
      - NOTEES_DATA_DIR=/data
      - NOTEES_LOG=false
      # Browser clients call the API cross-origin (LAN path). Auth is
      # header-based (no cookies), so the * default exposes no credential
      # surface on a loopback/LAN-trusted deployment; the fleet host pins
      # its real origins in .env (comma-separated).
      - NOTEES_CORS_ORIGIN=${NOTEES_CORS_ORIGIN:-*}
    healthcheck:
      test: wget -qO- http://127.0.0.1:8377/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  notees-web:
    image: ghcr.io/miquelrosell99/notees-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: notees-web
    ports:
      - "${NOTEES_WEB_HTTP:-0.0.0.0:8378}:80"
    environment:
      # Optional prefill for non-standard sync topologies (the web client
      # guesses its sync URL from its own origin, which is right on every
      # standard path — deployment.md; empty ships no prefill).
      - NOTEES_SERVER_URL=${NOTEES_SERVER_URL:-}
    depends_on:
      notees-sync:
        condition: service_healthy
    restart: unless-stopped

  notees-edge:
    image: notees-edge:local
    container_name: notees-edge
    # OPTIONAL tailnet HTTPS edge (Caddy + the tailscale plugin), enabled with
    # the "edge" compose profile — the core stack has no dependency on it
    # (plain http on the remappable app ports keeps working). One required
    # env, NOTEES_EDGE_NAME (the tailnet hostname); certificates issue and
    # renew automatically via the mounted tailscaled socket. /api/* proxies
    # to the sync server, everything else to the web client — both over the
    # compose network — so the https page calls its API same-origin (browser
    # storage requires a secure context). NOTEES_EDGE_HTTP remaps the port.
    profiles: ["edge"]
    ports:
      - "${NOTEES_EDGE_HTTP:-443}:443"
    environment:
      - NOTEES_EDGE_NAME=${NOTEES_EDGE_NAME:?set NOTEES_EDGE_NAME (the tailnet hostname) in .env to enable the edge}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/tailscale:/var/run/tailscale:ro
    restart: unless-stopped
