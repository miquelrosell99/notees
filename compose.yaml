# Docker Compose for Development
# Runs backend and frontend separately with hot-reload support
#
# Usage: docker compose up

services:
  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    container_name: notees-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # NOTE: fsync/synchronous_commit/full_page_writes are OFF for dev speed.
    # Data WILL be lost on unclean shutdown. Never use these settings in production.
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notees -d notees"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API with hot reload
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: notees-backend-dev
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      RELOAD: "true"
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend with Vite dev server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: notees-frontend-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_dev_data:
