# Docker Compose for Development
# Runs backend and frontend separately with hot-reload support
#
# Usage: docker compose up

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: notees-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: notees
      POSTGRES_PASSWORD: change_me_dev_password
      POSTGRES_DB: notees
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notees -d notees"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API with hot reload
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: notees-backend-dev
    restart: unless-stopped
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      RELOAD: "true"
      HOST: 0.0.0.0
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://notees:change_me_dev_password@postgres:5432/notees
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend with Vite dev server
  frontend:
    image: node:20-alpine
    container_name: notees-frontend-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  node_modules:
