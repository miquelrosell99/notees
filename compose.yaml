# Notees v2 — production stack (notees-sync server + notees-web client).
# Images are prebuilt and published to ghcr (see v2/apps/*/Dockerfile);
# tags are pinned per release. Dev stack: compose.dev.yaml (v1, legacy).
# Data lives under ./config/notees/ (gitignored); the v1 app data in ./data/
# is untouched by this stack.

services:
  notees-sync:
    image: ghcr.io/miquelrosell99/notees-sync:${NOTEES_SYNC_TAG:-2.0.0-m1}
    container_name: notees-sync
    ports:
      - "${NOTEES_SYNC_PORT:-8377}:8377"
    volumes:
      - ./config/notees/sync:/data
    environment:
      - NOTEES_DATA_DIR=/data
      - NOTEES_CORS_ORIGIN=${NOTEES_CORS_ORIGIN:-http://localhost:8080}
    healthcheck:
      test: wget -qO- http://localhost:8377/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  notees-web:
    image: ghcr.io/miquelrosell99/notees-web:${NOTEES_WEB_TAG:-2.0.0-m1}
    container_name: notees-web
    ports:
      - "${NOTEES_WEB_PORT:-8080}:80"
    environment:
      - NOTEES_SERVER_URL=${NOTEES_SERVER_URL:-http://localhost:8377}
    depends_on:
      notees-sync:
        condition: service_healthy
    restart: unless-stopped
