services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: notees-postgres
    environment:
      POSTGRES_USER: notees
      POSTGRES_PASSWORD: change_me_dev_password
      POSTGRES_DB: notees
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not exposed externally - only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notees -d notees"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API with hot reload
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: notees-backend-dev
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      # Mount source code for hot reload
      - ./app:/app/app:ro
      # Persist data (for assets only now)
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - RELOAD=true
      - HOST=localhost
      - PORT=8000
      - DATABASE_URL=postgresql://notees:change_me_dev_password@postgres:5432/notees
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend with Vite dev server
  frontend:
    image: node:20-alpine
    container_name: notees-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume for node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
