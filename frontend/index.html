<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/notees-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121211" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A self-hosted knowledge management system" />
    <title>Notees</title>
    <!-- Base tag for SPA routing -->
    <base href="/" />
  </head>
  <body>
    <!-- Static splash screen: visible immediately on page load, before any JS runs. -->
    <div
      id="notees-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #121211;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 3px solid rgba(255, 255, 255, 0.2);
          border-top-color: #ffffff;
          border-radius: 50%;
          animation: notees-splash-spin 1s linear infinite;
        "
      ></div>
      <div style="margin-top: 16px; font-size: 14px; opacity: 0.8;">Loading Notees…</div>
    </div>
    <style>
      @keyframes notees-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      window.__hideNoteesSplash = function () {
        const splash = document.getElementById('notees-splash');
        if (splash) splash.remove();
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
