<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/notees-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121211" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A self-hosted knowledge management system" />
    <title>Notees</title>
    <!-- Base tag for SPA routing -->
    <base href="/" />
  </head>
  <body>
    <!-- Static splash screen: visible immediately on page load, before any JS runs. -->
    <div
      id="notees-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #121211;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 3px solid rgba(255, 255, 255, 0.2);
          border-top-color: #ffffff;
          border-radius: 50%;
          animation: notees-splash-spin 1s linear infinite;
        "
      ></div>
      <div style="margin-top: 16px; font-size: 14px; opacity: 0.8;">Loading Notees…</div>
    </div>
    <style>
      @keyframes notees-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      window.__hideNoteesSplash = function () {
        const splash = document.getElementById('notees-splash');
        if (splash) splash.remove();
      };

      // Firefox private browsing (and some hardened browser configurations)
      // expose localStorage but throw NS_ERROR_ABORT when it is accessed.
      // lib0/yjs reads localStorage at import time, so we polyfill it before
      // any module code runs.
      (function () {
        function makeMemoryStorage() {
          const store = new Map();
          return {
            getItem: function (key) {
              return store.has(key) ? store.get(key) : null;
            },
            setItem: function (key, value) {
              store.set(key, String(value));
            },
            removeItem: function (key) {
              store.delete(key);
            },
            clear: function () {
              store.clear();
            },
            key: function (index) {
              return Array.from(store.keys())[index] ?? null;
            },
            get length() {
              return store.size;
            },
          };
        }

        function patchIfBroken(name) {
          try {
            const storage = window[name];
            if (!storage) return;
            storage.getItem('__notees_storage_test__');
          } catch (err) {
            console.warn('[Notees] ' + name + ' is inaccessible, using in-memory polyfill:', err);
            try {
              Object.defineProperty(window, name, {
                value: makeMemoryStorage(),
                writable: true,
                configurable: true,
              });
            } catch (e) {
              console.error('[Notees] Failed to polyfill ' + name + ':', e);
            }
          }
        }

        patchIfBroken('localStorage');
        patchIfBroken('sessionStorage');
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Lightweight reload-cause diagnostic. In development this helps capture
         why a tab reloaded (Vite HMR, programmatic reload, browser discard,
         WebSocket reconnect, etc.). It is intentionally minimal and does not
         send data anywhere. -->
    <script>
      (function () {
        if (typeof window === 'undefined') return;
        var KEY = '__notees_reload_log';
        var MAX = 32;

        function now() {
          return new Date().toISOString();
        }

        function push(type, detail) {
          try {
            var log = JSON.parse(window.sessionStorage.getItem(KEY) || '[]');
            log.push({ t: now(), type: type, detail: detail, url: window.location.href });
            if (log.length > MAX) log = log.slice(-MAX);
            window.sessionStorage.setItem(KEY, JSON.stringify(log));
          } catch (e) {
            // Ignore private-browsing storage errors.
          }
        }

        // Replay previous session's last events on load so they survive reloads.
        try {
          var prev = JSON.parse(window.sessionStorage.getItem(KEY) || '[]');
          if (prev.length > 0) {
            console.log('[reload-diag] previous session events:', prev);
          }
          window.sessionStorage.removeItem(KEY);
        } catch (e) {
          // ignore
        }

        function stack() {
          try {
            throw new Error('reload-diag');
          } catch (e) {
            return e.stack || '';
          }
        }

        ['beforeunload', 'pagehide', 'unload', 'pageshow', 'visibilitychange'].forEach(function (name) {
          window.addEventListener(name, function () {
            push(name, { visibilityState: document.visibilityState, hidden: document.hidden });
          });
        });

        var origReload = window.location.reload;
        window.location.reload = function () {
          push('location.reload', { stack: stack() });
          return origReload.apply(this, arguments);
        };

        var origClose = window.close;
        window.close = function () {
          push('window.close', { stack: stack() });
          return origClose.apply(this, arguments);
        };

        var origWebSocket = window.WebSocket;
        window.WebSocket = function (url, protocols) {
          var ws = protocols ? new origWebSocket(url, protocols) : new origWebSocket(url);
          var label = typeof url === 'string' ? url : String(url);
          push('ws:open', { url: label });
          ws.addEventListener('open', function () {
            push('ws:open-event', { url: label });
          });
          ws.addEventListener('close', function (ev) {
            push('ws:close-event', { url: label, code: ev.code, reason: ev.reason, wasClean: ev.wasClean });
          });
          ws.addEventListener('message', function (ev) {
            var data = typeof ev.data === 'string' ? ev.data : '[binary]';
            if (label.includes('/@vite/') || label.includes('/api/ws/')) {
              push('ws:message', { url: label, data: data.slice(0, 200) });
            }
          });
          return ws;
        };
        window.WebSocket.prototype = origWebSocket.prototype;

        var origPushState = history.pushState;
        var origReplaceState = history.replaceState;
        history.pushState = function () {
          push('history.pushState', { url: window.location.href, stack: stack() });
          return origPushState.apply(this, arguments);
        };
        history.replaceState = function () {
          push('history.replaceState', { url: window.location.href, stack: stack() });
          return origReplaceState.apply(this, arguments);
        };

        window.addEventListener('error', function (ev) {
          push('error', { message: ev.message, filename: ev.filename, lineno: ev.lineno, colno: ev.colno });
        });
        window.addEventListener('unhandledrejection', function (ev) {
          push('unhandledrejection', {
            reason: ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason),
          });
        });
      })();
    </script>
  </body>
</html>
