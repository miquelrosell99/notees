<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/notees-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121211" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A self-hosted knowledge management system" />
    <title>Notees</title>
    <!-- Base tag for SPA routing -->
    <base href="/" />
  </head>
  <body>
    <!-- Static splash screen: visible immediately on page load, before any JS runs. -->
    <div
      id="notees-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #121211;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      "
    >
      <div
        style="
          width: 40px;
          height: 40px;
          border: 3px solid rgba(255, 255, 255, 0.2);
          border-top-color: #ffffff;
          border-radius: 50%;
          animation: notees-splash-spin 1s linear infinite;
        "
      ></div>
      <div style="margin-top: 16px; font-size: 14px; opacity: 0.8;">Loading Notees…</div>
    </div>
    <style>
      @keyframes notees-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      window.__hideNoteesSplash = function () {
        const splash = document.getElementById('notees-splash');
        if (splash) splash.remove();
      };

      // Firefox private browsing (and some hardened browser configurations)
      // expose localStorage but throw NS_ERROR_ABORT when it is accessed.
      // lib0/yjs reads localStorage at import time, so we polyfill it before
      // any module code runs.
      (function () {
        function makeMemoryStorage() {
          const store = new Map();
          return {
            getItem: function (key) {
              return store.has(key) ? store.get(key) : null;
            },
            setItem: function (key, value) {
              store.set(key, String(value));
            },
            removeItem: function (key) {
              store.delete(key);
            },
            clear: function () {
              store.clear();
            },
            key: function (index) {
              return Array.from(store.keys())[index] ?? null;
            },
            get length() {
              return store.size;
            },
          };
        }

        function patchIfBroken(name) {
          try {
            const storage = window[name];
            if (!storage) return;
            storage.getItem('__notees_storage_test__');
          } catch (err) {
            console.warn('[Notees] ' + name + ' is inaccessible, using in-memory polyfill:', err);
            try {
              Object.defineProperty(window, name, {
                value: makeMemoryStorage(),
                writable: true,
                configurable: true,
              });
            } catch (e) {
              console.error('[Notees] Failed to polyfill ' + name + ':', e);
            }
          }
        }

        patchIfBroken('localStorage');
        patchIfBroken('sessionStorage');
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
