# Development reverse proxy in front of Vite.
# Vite runs on plain HTTP at port 5174 inside the container.
# Nginx exposes both HTTPS (5173) and HTTP (5172) to the host.

worker_processes auto;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    # Helper variable for proxying websockets.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream vite {
        server 127.0.0.1:5174;
    }

    server {
        listen 5173 ssl;
        server_name _;

        ssl_certificate /tmp/notees-dev.crt;
        ssl_certificate_key /tmp/notees-dev.key;

        location / {
            proxy_pass http://vite;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite HMR WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 5172;
        server_name _;

        location / {
            proxy_pass http://vite;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
