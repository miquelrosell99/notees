name: Nightly APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    uses: ./.github/workflows/android.yml
    with:
      build-mode: release
      sign-release: false

  release:
    name: Create nightly release
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: notees-android-apk
          path: mobile/dist

      - name: Rename nightly APK
        working-directory: mobile/dist
        run: mv notees-*.apk notees-nightly.apk

      - name: Create / update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly"
          SHA="${{ steps.sha.outputs.sha }}"

          # Delete existing nightly tag + release so we can recreate it
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/$TAG 2>/dev/null || true

          # Create new nightly release with the APK
          gh release create "$TAG" \
            "mobile/dist/notees-nightly.apk#notees-nightly.apk" \
            --prerelease \
            --title "Nightly Build ($SHA)" \
            --notes "Automated nightly build from commit \`$SHA\`.\
          \
          ⚠️ This is an unstable nightly build. Install at your own risk."

      - name: Keep only last 5 nightly releases (cleanup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List prereleases tagged as nightly-*, keep only the 5 most recent
          gh release list --limit 100 --json tagName,createdAt,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly"))) | .tagName' \
            | tail -n +6 | xargs -I {} gh release delete {} --yes --cleanup-tag 2>/dev/null || true
