name: Nightly Docker images

# Scheduled build of main's head (03:23 UTC, same slot as the nightly CI) —
# the `:nightly` channel for hosts that want to track main without building
# locally. Publishes `ghcr.io/miquelrosell99/{notees-sync,notees-web}:nightly`
# plus a dated tag (`nightly-YYYYMMDD`). NEVER `:latest` — that tag belongs
# to stable semver releases only (see release-docker.yml). Uses the
# workflow's GITHUB_TOKEN (packages: write); manual dispatch reruns the
# nightly build on demand.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: notees-sync
            dockerfile: apps/server/Dockerfile
          - image: notees-web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/miquelrosell99/${{ matrix.image }}
          tags: |
            type=raw,value=nightly
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nightly-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.image }}
