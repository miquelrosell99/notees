name: Nightly Docker images

# Scheduled build of main's head (03:23 UTC, same slot as the nightly CI) —
# the `:nightly` channel for hosts that want to track main without building
# locally. Publishes `ghcr.io/miquelrosell99/{notees-sync,notees-web}:nightly`
# plus a dated tag (`nightly-YYYYMMDD`). NEVER `:latest` — that tag belongs
# to stable semver releases only (see release-docker.yml). Uses the
# workflow's GITHUB_TOKEN (packages: write); manual dispatch reruns the
# nightly build on demand.
#
# The dispatch input `git-ref` (default `main`) selects the ref to build —
# nightly is main's head, so a dispatch guard fails the run unless git-ref
# IS the repository default branch (exact string compare against
# `github.event.repository.default_branch`); passing a SHA is accepted only
# when it is the default branch's SHA — pass the branch name instead.
# Schedule events always build the default branch head.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Ref to build — must be the repository default branch (main). A SHA is accepted only if it is the default branch's SHA."
        required: false
        default: "main"

concurrency:
  group: nightly-docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: notees-sync
            dockerfile: apps/server/Dockerfile
          - image: notees-web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Guard — nightly must build the default branch
        if: github.event_name == 'workflow_dispatch' && inputs['git-ref'] != github.event.repository.default_branch
        run: |
          echo "::error::nightly is main's head: git-ref must be the repository default branch ('${{ github.event.repository.default_branch }}'). A SHA is accepted only when it is the default branch's SHA — pass the branch name instead."
          exit 1

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs['git-ref'] || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/miquelrosell99/${{ matrix.image }}
          tags: |
            type=raw,value=nightly
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nightly-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=nightly-${{ matrix.image }}
