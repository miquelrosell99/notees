name: Android Flutter Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile_flutter/**'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile_flutter/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Flutter APK
        run: |
          docker run --rm \
            -v "$PWD/mobile_flutter:/project" \
            -v flutter-pub-cache:/root/.pub-cache \
            -v flutter-android-sdk:/opt/android-sdk-linux \
            ghcr.io/cirruslabs/flutter:stable \
            bash -c "cd /project && flutter pub get && flutter build apk --release"

      - name: Upload APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: notees-flutter-apk
          path: mobile_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Compute SHA-256
        id: checksum
        run: |
          cp mobile_flutter/build/app/outputs/flutter-apk/app-release.apk /tmp/notees-flutter.apk
          sha256sum /tmp/notees-flutter.apk > /tmp/notees-flutter.apk.sha256
          echo "sum=$(cut -d' ' -f1 /tmp/notees-flutter.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Flutter Android APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h mobile_flutter/build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`${{ steps.checksum.outputs.sum }}\`" >> "$GITHUB_STEP_SUMMARY"
