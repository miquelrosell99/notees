name: Docker image build+push (reusable)

# Called by publish-docker.yml (per-push SHA publishes). One image per call —
# the caller passes the image name, dockerfile, and the docker/metadata-action
# tag spec. Shares the `nightly-<image>` gha cache scope with the nightly
# workflow, so a warm nightly makes pushes cheap and a warm push makes the
# nightly cheap. NEVER publishes `:latest` — that tag belongs to stable
# semver releases only (see release-docker.yml). Per-push callers also move
# `:nightly` — the moving newest-main channel (thin gate); the dated
# fully-gated snapshots stay the nightly cron's. Uses the workflow's
# GITHUB_TOKEN (packages: write).

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      tags:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # brand is a git submodule (design tokens); the @notees/* packages
          # resolve from the workspace in the build context — no vendor pin.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/miquelrosell99/${{ inputs.image }}
          tags: ${{ inputs.tags }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nightly-${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=nightly-${{ inputs.image }}
