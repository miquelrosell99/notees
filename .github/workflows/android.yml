name: Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      build-mode:
        description: 'Flutter build mode'
        type: choice
        options:
          - release
          - debug
          - profile
        default: release
      git-ref:
        description: 'Git ref to build from'
        required: true
        default: 'main'
      sign-release:
        description: 'Sign the APK with the uploaded keystore (release only)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      build-mode:
        type: string
        default: release
      git-ref:
        type: string
        default: ''
      sign-release:
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  BUILD_MODE: ${{ inputs.build-mode || github.event.inputs.build-mode || 'release' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.git-ref || github.event.inputs.git-ref || github.ref }}

      - name: Resolve version
        id: version
        working-directory: mobile
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/.*://' | xargs)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Cache pub dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          gradle-home-cache-cleanup: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Static analysis
        working-directory: mobile
        run: flutter analyze

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --"$BUILD_MODE"
          mkdir -p dist
          case "$BUILD_MODE" in
            release) apk_file="app-release.apk" ;;
            debug) apk_file="app-debug.apk" ;;
            profile) apk_file="app-profile.apk" ;;
            *)
              echo "::error::Unsupported build mode: $BUILD_MODE"
              exit 1
              ;;
          esac
          cp "build/app/outputs/flutter-apk/$apk_file" dist/notees.apk

      - name: Sign release APK
        if: ${{ (inputs.sign-release == true || github.event.inputs.sign-release == 'true') && env.BUILD_MODE == 'release' }}
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required to sign the release APK."
            exit 1
          fi
          tmpdir=$(mktemp -d)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$tmpdir/keystore.jks"
          apksigner=$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using apksigner: $apksigner"
          "$apksigner" sign \
            --ks "$tmpdir/keystore.jks" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
            --alias "${ANDROID_KEY_ALIAS:-androiddebugkey}" \
            --in dist/notees.apk \
            --out dist/notees-signed.apk
          mv dist/notees-signed.apk dist/notees.apk
          rm -rf "$tmpdir"

      - name: Rename APK with version
        id: artifact
        working-directory: mobile
        run: |
          version="${{ steps.version.outputs.version }}"
          name="notees-android-${version}.apk"
          cp dist/notees.apk "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: notees-android-apk
          path: mobile/dist/${{ steps.artifact.outputs.name }}
          retention-days: 14

      - name: Compute SHA-256
        id: checksum
        working-directory: mobile
        run: |
          sha256sum "dist/${{ steps.artifact.outputs.name }}" > dist/notees.apk.sha256
          echo "sum=$(cut -d' ' -f1 dist/notees.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Android APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: ${{ steps.artifact.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(du -h mobile/dist/${{ steps.artifact.outputs.name }} | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`${{ steps.checksum.outputs.sum }}\`" >> "$GITHUB_STEP_SUMMARY"
