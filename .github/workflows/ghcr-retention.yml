name: ghcr retention

# Keeps the Free plan's 500 MB Packages budget flat. ghcr accumulates a full
# tag set per publish: moving tags (latest, nightly) and release tags stay
# forever; dated nightlies (`nightly-YYYYMMDD`) keep the newest 10; per-push
# `sha-*` tags keep a 30-day rollback window, then go. Runs weekly + manual
# dispatch (dry-run by default — inspect the deletion list before the first
# real sweep).
#
# Deleting package versions needs the versions to have been published by a
# workflow GITHUB_TOKEN (they are — every image here publishes in-workflow),
# so this job's GITHUB_TOKEN (packages: write) manages them. If GitHub ever
# 403s a DELETE, mint a fine-grained PAT with `delete:packages` and pass it
# as the GH_TOKEN secret.

on:
  schedule:
    - cron: "37 4 * * 1" # Mondays 04:37 UTC, 50 min after the nightly CI
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting (default true)"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-22.04
    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs['dry-run'] }}
    steps:
      - name: Prune ghcr package versions
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          window=2592000 # 30 days
          for img in notees-sync notees-web; do
            gh api --paginate "users/miquelrosell99/packages/container/$img/versions" > "versions-$img.json"
            # One version carries the whole tag set of a publish (dated +
            # sha + moving can share an id), so protection is per version:
            # anything tagged latest/nightly/release is untouchable; the rest
            # is deletable only under a specific cut.
            jq -s --arg img "$img" --argjson now "$now" --argjson window "$window" -r '
              flatten as $vs
              | ($vs
                  | map(select([.metadata.container.tags[]? | test("^nightly-[0-9]{8}$")] | length > 0))
                  | sort_by(.created_at) | reverse | .[0:10] | map(.id)) as $keepdated
              | $vs[]
              | . as $v
              | ($v.metadata.container.tags // []) as $tags
              | select([$tags[] | select(. == "latest" or . == "nightly" or test("^v?[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))] | length == 0)
              | select(
                  (([$tags[] | select(test("^sha-"))] | length > 0)
                    and (($now - ($v.created_at | fromdateiso8601)) > $window))
                  or (([$tags[] | select(test("^nightly-[0-9]{8}$"))] | length > 0)
                    and ([$keepdated[] | select(. == $v.id)] | length == 0))
                )
              | [$img, $v.id, ($tags | join(",")), $v.created_at] | @tsv
            ' "versions-$img.json" | while IFS=$'\t' read -r name id tags created; do
              echo "prune $name id=$id created=$created tags=$tags"
              if [ "$DRY_RUN" = "false" ]; then
                gh api -X DELETE "users/miquelrosell99/packages/container/$name/versions/$id"
              fi
            done
          done
