name: ci

# Gating: PRs + a nightly run of main's head. The old `push: main` trigger is
# gone — the nightly cron covers main's head, and per-push failures on main
# were the operator pain. Flake mitigation for the jsdom timing specs lives in
# the vitest configs (CI-conditional retry), not here.
#
# SonarQube: the `sonar` job runs on the NIGHTLY schedule only (PR CI stays
# fast). It is inert unless the repo defines:
#   - SONAR_TOKEN       (repository secret — the SonarQube token)
#   - SONAR_HOST_URL    (repository variable — the SonarQube server URL)

on:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r --workspace-concurrency=1 build
      - name: Test
        run: pnpm test

  # AG4 drift gate: the OpenAPI document must describe every route the
  # server registers (and no ghosts). Runs the coverage + taxonomy tests on
  # their own so a doc-drift failure points here, not inside the full suite.
  openapi-coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: OpenAPI route coverage
        run: pnpm -C apps/server exec vitest run test/openapi-coverage.test.ts test/error-taxonomy.test.ts

  # SonarQube scan — nightly only, conditional on the repo being configured
  # (SONAR_HOST_URL var set). Keeps PR CI fast; quality-gate feedback rides
  # the nightly run instead of blocking every PR.
  sonar:
    if: ${{ github.event_name == 'schedule' && vars.SONAR_HOST_URL != '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
