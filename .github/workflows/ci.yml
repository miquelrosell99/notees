name: ci

# Gating: PRs + a nightly run of main's head. The old `push: main` trigger is
# gone — the nightly cron covers main's head, and per-push failures on main
# were the operator pain. Flake mitigation for the jsdom timing specs lives in
# the vitest configs (CI-conditional retry), not here.

on:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The core packages resolve from the pinned vendor/notees submodule
          # (→ miquelrosell99/notees-sync); brand is the design-token source.
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r --workspace-concurrency=1 build
      - name: Test
        run: pnpm test

  # CSS token-drift gate: app CSS references tokens, never law-owned literals
  # (colors, motion, spacing, z-index). Dependency-free; no pnpm install.
  css-token-drift:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Gate self-tests
        run: node --test scripts/check-css-tokens.test.mjs
      - name: CSS token drift
        run: node scripts/check-css-tokens.mjs
