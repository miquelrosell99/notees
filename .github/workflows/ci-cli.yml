name: ci-cli

# Gating for the Notees CLI (clients/cli) — PRs + a nightly run of main's
# head (fleet trigger matrix). The `push` and `pull_request` triggers are
# path-gated: the CLI suite is the lockstep consumer of the core packages,
# so every packages/** change must keep it green. The nightly cron covers
# main's head, and per-push CI on main was a recurring failure source. A
# manual dispatch runs whatever ref the operator picks in the UI.

on:
  push:
    paths: ["clients/cli/**", "packages/**"]
  pull_request:
    paths: ["clients/cli/**", "packages/**"]
  schedule:
    - cron: "23 3 * * *"   # nightly main-head cover, off the :00 mark
  workflow_dispatch:

concurrency:
  group: ci-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The dev loop and the test suite (better-sqlite3 native build) must
        # stay green on both the LTS train and current node.
        node-version: [22, 26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # The CLI is a workspace project of the monorepo: the recursive
        # build compiles the core packages' dists (dev-condition exports —
        # tsc reads dist) and the CLI bundle — test/release-bundle.test.ts
        # gates dist/cli.js.
        run: pnpm -r --workspace-concurrency=1 build
      - name: Typecheck + test (CLI)
        run: pnpm --filter "@notees/cli" typecheck && pnpm --filter "@notees/cli" test
