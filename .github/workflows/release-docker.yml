name: Release Docker images

# Publishes the two service images to ghcr using the workflow's GITHUB_TOKEN
# (packages: write) — the dedicated CI push that does NOT depend on a
# personal registry token (the host's ghcr login stays read-only).
#
# Tag push (v*) publishes the tag (v-prefixed + semver). `:latest` applies
# ONLY to stable semver tags — prereleases (v2.0.0-m2 and friends, any tag
# with a `-`) never move `latest`.
#
# Publish requires a PUSHED tag — sonarly semantics, per the fleet ruling.
# A manual dispatch is build-verify only: it builds the images but NEVER
# pushes (the build-push step's push is gated to tag events). A dispatch
# takes one input:
#
#   git-ref — the ref to build (branches or SHAs; default `main`). Lets a
#     dispatch verify that a branch/SHA still builds the release images.
#     A git-ref pointing at a release tag (v* / refs/tags/v*) fails loud on
#     dispatch — push the tag instead; a pushed tag triggers the real
#     release run (and is the ONLY way images get published).
#
# Nightly main builds live in nightly-docker.yml (`:nightly`).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Ref to build-verify — branches or SHAs (default main). Never pushed; pushing a v* tag is the only way to publish."
        required: false
        default: "main"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: notees-sync
            dockerfile: apps/server/Dockerfile
          - image: notees-web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Guard — dispatch must not target a release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          ref="${{ inputs['git-ref'] }}"
          case "$ref" in
            v*|refs/tags/v*)
              echo "::error::git-ref '$ref' is a release tag — push the tag instead; a pushed tag triggers the real release run (and moves :latest only for stable semver). A dispatch build-verifies only and never publishes."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs['git-ref'] || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/miquelrosell99/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Publish requires a pushed tag (sonarly semantics) — a dispatch
          # build-verifies only and never pushes.
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
