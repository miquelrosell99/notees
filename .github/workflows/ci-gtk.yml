name: ci-gtk

# Gating: PRs touching the GTK client + a nightly run of main's head. Moved to
# the monorepo root (ADR-002): the pull_request trigger is path-filtered to the
# GTK client + the shared packages — the suite consumes the vendored wire
# fixtures, so a package/fixture-corpus change re-runs this gate (lockstep).
# All run steps execute under clients/gtk/ (defaults.run.working-directory).
# (History: clients/gtk/.github/workflows/ci.yml.)

on:
  pull_request:
    paths: ["clients/gtk/**", "packages/**"]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git ref to run CI against (defaults to main)'
        required: false
        default: 'main'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: clients/gtk
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.git-ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Ruff check
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy src
