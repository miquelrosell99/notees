name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }}
            type=raw,value=latest

      - name: Build and push image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  android:
    name: Build and attach Android APK
    uses: ./.github/workflows/android.yml
    with:
      build-mode: release
      git-ref: ${{ inputs.tag || github.ref_name }}
      sign-release: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  attach-android:
    name: Attach Android APK to release
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: notees-android-apk
          path: mobile/dist

      - name: Compute checksum and rename asset
        id: asset
        working-directory: mobile/dist
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          ASSET="notees-android-${TAG}.apk"
          mv notees-*.apk "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          echo "name=$ASSET" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.asset.outputs.tag }}"
          if ! gh release view "$TAG" --json url >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.asset.outputs.tag }}"
          ASSET="mobile/dist/${{ steps.asset.outputs.name }}"
          CHECKSUM="${ASSET}.sha256"
          gh release upload "$TAG" "$ASSET" "$CHECKSUM" --clobber

      - name: Update release notes with checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.asset.outputs.tag }}"
          ASSET="${{ steps.asset.outputs.name }}"
          SHA256=$(cut -d' ' -f1 "mobile/dist/${ASSET}.sha256")

          # Fetch current body, append checksum section if missing
          BODY=$(gh release view "$TAG" --json body --jq '.body')
          if ! echo "$BODY" | grep -q 'SHA-256'; then
            {
              printf '%s\n\n---\n\n### Verification\n\n' "$BODY"
              printf '**SHA-256 (%s):** `%s`\n' "$ASSET" "$SHA256"
            } > /tmp/release-body.md
            gh release edit "$TAG" --notes-file /tmp/release-body.md
          fi
