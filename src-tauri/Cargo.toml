[package]
name = "notees"
version = "0.1.0"
description = "Notees desktop shell (Tauri v2) — hosts the web client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "notees_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
